name: Daily & Weekly Academic Paper Automation

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Rapor Modu (daily veya weekly)'
        required: true
        default: 'daily'
        type: choice
        options:
        - daily
        - weekly

jobs:
  run-paper-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Run Mode
        id: mode_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            DAY_OF_WEEK=$(date +%u)
            if [ "$DAY_OF_WEEK" -eq 7 ]; then
              echo "MODE=weekly" >> $GITHUB_ENV
            else
              echo "MODE=daily" >> $GITHUB_ENV
            fi
          fi

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python main.py --mode ${{ env.MODE }}
